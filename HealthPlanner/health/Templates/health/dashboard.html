<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Health Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand">Health Planner</span>
            <div class="ms-auto">
                <form method="post" action="{% url 'health:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="p-4 bg-white rounded shadow-sm">
            <h1 class="h3 mb-3">Welcome, {{ request.user.username }}!</h1>
            <p class="mb-0">Your Health Planner account is ready. Start tracking your goals and routines.</p>
        </div>
    </main>
</body>
</html>
