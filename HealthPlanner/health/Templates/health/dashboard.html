<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Health Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f3f4f3;
            font-family: "Inter", "Segoe UI", sans-serif;
        }

        .topbar {
            background: #1f8a57;
        }
    </style>
</head>
<body class="bg-light min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark topbar py-2">
        <div class="container">
            <span class="navbar-brand fw-semibold">Health Planner</span>
            <span class="text-white-50 small ms-3">Welcome back, {{ request.user.username }}</span>
            <div class="ms-auto">
                <form method="post" action="{% url 'health:logout' %}">{% csrf_token %}<button type="submit" class="btn btn-outline-light btn-sm">Log out</button></form>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="p-4 bg-white border rounded shadow-sm">
            <h1 class="h2 mb-2">Welcome to your dashboard, {{ request.user.username }}!</h1>
            <p class="text-muted mb-0">Your Health Planner account is ready. Start tracking your goals and routines.</p>
        </div>
    </main>
</body>
</html>
