<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your goal - Health Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --hp-green: #1f8a57;
            --hp-green-dark: #166a42;
            --hp-page: #f3f5f4;
        }
        body {
            background: var(--hp-page);
            font-family: "Inter", "Segoe UI", sans-serif;
        }
        .btn-health {
            background: var(--hp-green);
            border-color: var(--hp-green);
        }
        .btn-health:hover {
            background: var(--hp-green-dark);
            border-color: var(--hp-green-dark);
        }
        .choice-card {
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.08);
            transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
        }
        .choice-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
            border-color: rgba(31, 138, 87, 0.35);
        }
    </style>
</head>
<body class="min-vh-100">
    <main class="container py-5" style="max-width: 920px;">
        <div class="p-4 bg-white border rounded shadow-sm">
            <h1 class="h3 mb-1">What’s your main goal?</h1>
            <p class="text-muted mb-0">We’ll tailor your experience (goals, suggestions) based on this choice.</p>
        </div>

        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-danger mb-0">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="mt-4">
            {% csrf_token %}
            <div class="row g-3">
                {% for value,label in choices %}
                <div class="col-md-4">
                    <label class="w-100">
                        <input class="d-none" type="radio" name="onboarding_goal" value="{{ value }}" required>
                        <div class="card choice-card h-100">
                            <div class="card-body">
                                <div class="fw-semibold">{{ label }}</div>
                                {% if value == "lose_weight" %}
                                    <div class="text-muted small mt-1">Calorie deficit + steady progress tracking</div>
                                {% elif value == "gain_muscle" %}
                                    <div class="text-muted small mt-1">Strength focus + nutrition targets</div>
                                {% elif value == "maintain_weight" %}
                                    <div class="text-muted small mt-1">Balanced habits + consistency</div>
                                {% endif %}
                            </div>
                        </div>
                    </label>
                </div>
                {% endfor %}
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-health text-white">Continue</button>
                <a href="{% url 'health:dashboard' %}" class="btn btn-outline-secondary">Skip for now</a>
            </div>
        </form>

        <script>
            // Make the whole card select the radio (accessibility-friendly)
            document.querySelectorAll('.choice-card').forEach(card => {
                card.addEventListener('click', () => {
                    const input = card.closest('label').querySelector('input[type="radio"]');
                    if (input) input.checked = true;
                });
            });
        </script>
    </main>
</body>
</html>
